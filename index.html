<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image + Audio to MP4</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #000;
  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

.bg-blur {
  position: fixed;
  inset: -40px;
  background-size: cover;
  background-position: center;
  filter: blur(60px) brightness(.35);
  opacity: 0;
  transition: opacity .8s ease;
  z-index: 0;
  pointer-events: none;
}

.bg-blur.active { opacity: 1; }

.card {
  position: relative;
  z-index: 1;
  background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border-radius: 16px;
  padding: 48px 40px;
  max-width: 640px;
  width: 100%;
}

h1 {
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: -.02em;
  margin-bottom: 4px;
}

.subtitle {
  color: rgba(255,255,255,.4);
  font-size: .8rem;
  margin-bottom: 36px;
}

.drop-zones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
}

.drop-zone {
  border: 1px dashed rgba(255,255,255,.15);
  border-radius: 10px;
  padding: 28px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  position: relative;
  overflow: hidden;
  min-height: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.drop-zone:hover, .drop-zone.dragover {
  border-color: rgba(255,255,255,.35);
  background: rgba(255,255,255,.03);
}

.drop-zone.has-file {
  border-color: rgba(255,255,255,.12);
  border-style: solid;
  cursor: default;
}

.drop-zone .label {
  font-size: .8rem;
  color: rgba(255,255,255,.45);
  font-weight: 400;
}

.drop-zone .hint {
  font-size: .7rem;
  color: rgba(255,255,255,.2);
  margin-top: 4px;
}

.drop-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.drop-zone.has-file input[type="file"] { display: none; }

.file-preview {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.drop-zone.has-file .file-preview { display: flex; }
.drop-zone.has-file .placeholder { display: none; }

.file-preview img {
  max-width: 100%;
  max-height: 100px;
  border-radius: 6px;
  object-fit: contain;
}

.file-preview .filename {
  font-size: .7rem;
  color: rgba(255,255,255,.4);
  word-break: break-all;
  text-align: center;
}

.file-preview .clear-btn {
  font-size: .7rem;
  color: rgba(255,255,255,.3);
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 8px;
  transition: color .2s;
}

.file-preview .clear-btn:hover { color: #fff; }

.actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.btn-create {
  background: #fff;
  color: #000;
  border: none;
  padding: 12px 36px;
  border-radius: 8px;
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s;
  letter-spacing: -.01em;
}

.btn-create:disabled {
  opacity: .15;
  cursor: not-allowed;
}

.btn-create:not(:disabled):hover { opacity: .85; }

.progress-area {
  display: none;
  width: 100%;
  flex-direction: column;
  gap: 8px;
}

.progress-area.active { display: flex; }

.progress-bar-track {
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,.08);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: #fff;
  border-radius: 2px;
  transition: width .3s;
}

.status-text {
  font-size: .75rem;
  color: rgba(255,255,255,.35);
  text-align: center;
}

.result-area {
  display: none;
  width: 100%;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-top: 24px;
}

.result-area.active { display: flex; }

.result-area video {
  width: 100%;
  max-height: 320px;
  border-radius: 8px;
  background: #000;
}

.btn-download {
  background: #fff;
  color: #000;
  border: none;
  padding: 10px 28px;
  border-radius: 8px;
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: opacity .2s;
}

.btn-download:hover { opacity: .85; }

.error-msg {
  display: none;
  border: 1px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.6);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: .8rem;
  text-align: center;
  margin-top: 12px;
}

.error-msg.active { display: block; }

@media (max-width: 520px) {
  .drop-zones { grid-template-columns: 1fr; }
  .card { padding: 28px 20px; }
}
</style>
</head>
<body>

<div class="bg-blur" id="bgBlur"></div>

<div class="card">
  <h1>Image + Audio to MP4</h1>
  <p class="subtitle">Combine an image and audio file into a video. Runs in your browser.</p>

  <div class="drop-zones">
    <div class="drop-zone" id="imageZone">
      <div class="placeholder">
        <div class="label">Drop image</div>
        <div class="hint">JPG, PNG, WebP</div>
      </div>
      <div class="file-preview">
        <img id="imageThumb" alt="preview">
        <span class="filename" id="imageName"></span>
        <button class="clear-btn" data-target="image">remove</button>
      </div>
      <input type="file" accept="image/jpeg,image/png,image/webp" id="imageInput">
    </div>

    <div class="drop-zone" id="audioZone">
      <div class="placeholder">
        <div class="label">Drop audio</div>
        <div class="hint">MP3, WAV, OGG</div>
      </div>
      <div class="file-preview">
        <span class="filename" id="audioName"></span>
        <button class="clear-btn" data-target="audio">remove</button>
      </div>
      <input type="file" accept="audio/mpeg,audio/wav,audio/ogg,audio/mp3,audio/wave,audio/x-wav" id="audioInput">
    </div>
  </div>

  <div class="actions">
    <button class="btn-create" id="createBtn" disabled>Create MP4</button>

    <div class="progress-area" id="progressArea">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="status-text" id="statusText">Preparing</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result-area" id="resultArea">
      <video id="videoPreview" controls></video>
      <a class="btn-download" id="downloadBtn" download="output.mp4">Download MP4</a>
    </div>
  </div>
</div>

<script>
(function() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(() => {
      if (!crossOriginIsolated) {
        navigator.serviceWorker.ready.then(() => {
          if (!crossOriginIsolated) location.reload();
        });
      }
    }).catch(() => {});
  }

  let imageFile = null;
  let audioFile = null;
  let bgObjectUrl = null;

  const bgBlur = document.getElementById('bgBlur');
  const imageZone = document.getElementById('imageZone');
  const audioZone = document.getElementById('audioZone');
  const imageInput = document.getElementById('imageInput');
  const audioInput = document.getElementById('audioInput');
  const imageThumb = document.getElementById('imageThumb');
  const imageName = document.getElementById('imageName');
  const audioName = document.getElementById('audioName');
  const createBtn = document.getElementById('createBtn');
  const progressArea = document.getElementById('progressArea');
  const progressFill = document.getElementById('progressFill');
  const statusText = document.getElementById('statusText');
  const errorMsg = document.getElementById('errorMsg');
  const resultArea = document.getElementById('resultArea');
  const videoPreview = document.getElementById('videoPreview');
  const downloadBtn = document.getElementById('downloadBtn');

  function setupDropZone(zone, input) {
    ['dragenter', 'dragover'].forEach(evt => {
      zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(evt => {
      zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove('dragover'); });
    });
    zone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        input.files = files;
        input.dispatchEvent(new Event('change'));
      }
    });
  }

  setupDropZone(imageZone, imageInput);
  setupDropZone(audioZone, audioInput);

  function setBgImage(file) {
    if (bgObjectUrl) URL.revokeObjectURL(bgObjectUrl);
    if (!file) {
      bgBlur.classList.remove('active');
      bgBlur.style.backgroundImage = '';
      bgObjectUrl = null;
      return;
    }
    bgObjectUrl = URL.createObjectURL(file);
    bgBlur.style.backgroundImage = 'url(' + bgObjectUrl + ')';
    bgBlur.classList.add('active');
  }

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (!file) return;
    imageFile = file;
    imageThumb.src = URL.createObjectURL(file);
    imageName.textContent = file.name;
    imageZone.classList.add('has-file');
    setBgImage(file);
    updateCreateBtn();
  });

  audioInput.addEventListener('change', () => {
    const file = audioInput.files[0];
    if (!file) return;
    audioFile = file;
    audioName.textContent = file.name;
    audioZone.classList.add('has-file');
    updateCreateBtn();
  });

  document.querySelectorAll('.clear-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const target = btn.dataset.target;
      if (target === 'image') {
        imageFile = null;
        imageInput.value = '';
        imageZone.classList.remove('has-file');
        URL.revokeObjectURL(imageThumb.src);
        setBgImage(null);
      } else {
        audioFile = null;
        audioInput.value = '';
        audioZone.classList.remove('has-file');
      }
      updateCreateBtn();
    });
  });

  function updateCreateBtn() {
    createBtn.disabled = !(imageFile && audioFile);
  }

  function setProgress(pct, text) {
    progressFill.style.width = pct + '%';
    if (text) statusText.textContent = text;
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('active');
  }

  function resetUI() {
    progressArea.classList.remove('active');
    resultArea.classList.remove('active');
    errorMsg.classList.remove('active');
    setProgress(0, 'Preparing');
  }

  function loadImage(file, maxW, maxH) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        if (w > maxW || h > maxH) {
          const scale = Math.min(maxW / w, maxH / h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        w = w % 2 === 0 ? w : w + 1;
        h = h % 2 === 0 ? h : h + 1;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(img.src);
        resolve(canvas);
      };
      img.onerror = () => reject(new Error('Failed to load image'));
      img.src = URL.createObjectURL(file);
    });
  }

  function getAudioDuration(file) {
    return new Promise((resolve, reject) => {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const reader = new FileReader();
      reader.onload = () => {
        audioCtx.decodeAudioData(reader.result).then(buffer => {
          audioCtx.close();
          resolve(buffer.duration);
        }).catch(reject);
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }

  function recordCanvas(canvas, durationSec) {
    return new Promise((resolve, reject) => {
      const stream = canvas.captureStream(24);
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
        ? 'video/webm;codecs=vp9'
        : 'video/webm';
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 2_500_000 });
      const chunks = [];

      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));
      recorder.onerror = (e) => reject(e.error || new Error('Recording failed'));

      recorder.start(1000);

      const totalMs = durationSec * 1000;
      const startTime = Date.now();
      const interval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const pct = Math.min(elapsed / totalMs, 1);
        setProgress(20 + pct * 40, 'Recording video ' + Math.round(pct * 100) + '%');
      }, 500);

      setTimeout(() => {
        clearInterval(interval);
        recorder.stop();
        stream.getTracks().forEach(t => t.stop());
      }, totalMs + 200);
    });
  }

  let ffmpegInstance = null;

  async function loadFFmpeg() {
    if (ffmpegInstance && ffmpegInstance.loaded) return ffmpegInstance;

    if (typeof FFmpeg === 'undefined' || typeof FFmpegUtil === 'undefined') {
      await loadScript('https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js');
      await loadScript('https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js');
    }

    const { FFmpeg: FFmpegClass } = FFmpeg;
    const ffmpeg = new FFmpegClass();

    ffmpeg.on('progress', ({ progress }) => {
      const pct = Math.min(Math.round(progress * 100), 100);
      setProgress(65 + pct * 0.3, 'Encoding MP4 ' + pct + '%');
    });

    const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.4/dist/umd';
    await ffmpeg.load({
      coreURL: baseURL + '/ffmpeg-core.js',
      wasmURL: baseURL + '/ffmpeg-core.wasm',
    });

    ffmpegInstance = ffmpeg;
    ffmpegInstance.loaded = true;
    return ffmpeg;
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src;
      s.crossOrigin = 'anonymous';
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(s);
    });
  }

  createBtn.addEventListener('click', async () => {
    if (!imageFile || !audioFile) return;

    resetUI();
    createBtn.disabled = true;
    progressArea.classList.add('active');

    try {
      setProgress(5, 'Loading image');
      const canvas = await loadImage(imageFile, 1920, 1080);

      setProgress(10, 'Analyzing audio');
      const duration = await getAudioDuration(audioFile);
      if (duration <= 0) throw new Error('Could not determine audio duration');

      setProgress(15, 'Recording frames');
      const webmBlob = await recordCanvas(canvas, duration);

      setProgress(60, 'Loading FFmpeg');
      const ffmpeg = await loadFFmpeg();

      setProgress(65, 'Preparing files');
      const { fetchFile } = FFmpegUtil;

      const webmData = new Uint8Array(await webmBlob.arrayBuffer());
      await ffmpeg.writeFile('video.webm', webmData);
      await ffmpeg.writeFile('audio', await fetchFile(audioFile));

      setProgress(68, 'Encoding MP4');
      await ffmpeg.exec([
        '-i', 'video.webm',
        '-i', 'audio',
        '-c:v', 'libx264',
        '-preset', 'fast',
        '-crf', '23',
        '-c:a', 'aac',
        '-b:a', '192k',
        '-shortest',
        '-movflags', '+faststart',
        '-pix_fmt', 'yuv420p',
        'output.mp4'
      ]);

      setProgress(95, 'Finalizing');
      const outputData = await ffmpeg.readFile('output.mp4');
      const mp4Blob = new Blob([outputData.buffer], { type: 'video/mp4' });

      await ffmpeg.deleteFile('video.webm').catch(() => {});
      await ffmpeg.deleteFile('audio').catch(() => {});
      await ffmpeg.deleteFile('output.mp4').catch(() => {});

      const url = URL.createObjectURL(mp4Blob);
      videoPreview.src = url;
      downloadBtn.href = url;

      setProgress(100, 'Done');
      resultArea.classList.add('active');
    } catch (err) {
      console.error(err);
      showError(err.message || 'Something went wrong');
    } finally {
      createBtn.disabled = !(imageFile && audioFile);
    }
  });
})();
</script>
</body>
</html>
