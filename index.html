<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IN THE BOOTH — 5.6.2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --fg: #fff;
      --dim: rgba(255,255,255,0.28);
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* ════════════════════
       HERO
    ════════════════════ */
    .hero {
      height: 100vh;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .artwork-outer {
      position: absolute;
      inset: 0;
    }

    .artwork-outer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .twitch-btn {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.4rem;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: clamp(0.65rem, 2vw, 0.85rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .twitch-btn:hover {
      background: #9b5de5;
      color: #fff;
    }

    .twitch-btn svg {
      width: 14px; height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ════════════════════
       FOTO — každá zabere
       celou výšku viewportu
    ════════════════════ */
    .photo-section {
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .photo-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ════════════════════
       KONEC / CREDIT
    ════════════════════ */
    .end-section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .credit {
      font-size: clamp(0.6rem, 1.8vw, 0.75rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-decoration: none;
      text-transform: lowercase;
      transition: color 0.2s;
      font-family: Arial, sans-serif;
    }

    .credit:hover { color: #fff; }
    @media (max-width: 600px) {
      .artwork-outer { align-items: center; }
      .artwork-outer img {
        object-fit: unset;
        width: 100%;
        height: auto;
        position: static;
      }
      .photo-bg {
        background-size: contain;
        background-position: center;
      }
    }
  </style>
</head>
<body>

  <!-- ══ HERO ══ -->
  <section class="hero">
    <div class="artwork-outer">
      <img src="Artboard_1.png" alt="In The Booth artwork" />
    </div>
    <a class="twitch-btn" href="https://twitch.tv/lifeondem08" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
      twitch.tv/lifeondem08
    </a>
  </section>

  <!-- ══ FOTKY ══
       Přidej nebo odeber <section class="photo-section"> bloky podle potřeby.
       Každá fotka = jedna sekce. Stránka se automaticky prodlouží.
  ══ -->
  <section class="photo-section">
    <div class="photo-bg" style="background-image: url('photos/01.jpg')"></div>
  </section>

  <section class="photo-section">
    <div class="photo-bg" style="background-image: url('photos/02.jpg')"></div>
  </section>

  <section class="photo-section">
    <div class="photo-bg" style="background-image: url('photos/03.jpg')"></div>
  </section>

  <!-- přidej další fotky sem: -->
  <!--
  <section class="photo-section">
    <div class="photo-bg" style="background-image: url('photos/04.jpg')"></div>
  </section>
  -->

  <!-- ══ CREDIT ══ -->
  <section class="end-section">
    <a class="credit" href="https://instagram.com/spendingmoreonmysafety/" target="_blank" rel="noopener">
      @spendingmoreonmysafety
    </a>
  </section>

</body>
</html>
