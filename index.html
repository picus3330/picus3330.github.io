<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IN THE BOOTH — 5.6.2026</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Image frame ─────────────────────────────────────── */

    .frame {
      position: relative;
      display: inline-block; /* shrinks to exact rendered image size */
      max-width: 100%;
      line-height: 0;        /* no phantom gap below image */
    }

    .frame img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    /* ── Countdown overlay ───────────────────────────────── */

    .countdown {
      position: absolute;
      top: 68%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: flex-start;
      gap: clamp(12px, 2.2vw, 30px);
      color: #000000;
      font-family: Arial;
      font-weight: 500;
      pointer-events: none;
      -webkit-font-smoothing: antialiased;
      white-space: nowrap;
    }

    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .cd-num {
      font-size: clamp(22px, 1.8vw, 50px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    .cd-label {
      font-size: clamp(5px, 0.6vw, 8px);
      font-weight: 300;
      letter-spacing: 0.2em;
      opacity: 0.55;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1;    }
      50%       { opacity: 0.2; }
    }

    .live-now {
      font-size: clamp(14px, 2vw, 22px);
      font-weight: 300;
      letter-spacing: 0.15em;
      animation: livePulse 2.5s ease-in-out infinite;
    }

    /* ── Invisible hotspot links ─────────────────────────── */

    .hotspot {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      display: block;
      cursor: default;
    }

    .hotspot:hover {
      cursor: pointer;
    }

    .hotspot-twitch {
      top:    76%;
      width:  22%;
      height: 5%;
    }

    .hotspot-insta {
      top:    98.5%;
      width:  16%;
      height: 3%;
    }
  </style>
</head>
<body>

<div class="frame">

  <img src="Artboard%201.png" alt="In The Booth — 5.6.2026">

  <!-- Countdown timer -->
  <div class="countdown" id="countdown"></div>

  <!-- Twitch hotspot -->
  <a class="hotspot hotspot-twitch"
     href="https://twitch.tv/lifeondem08"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Twitch: lifeondem08"></a>

  <!-- Instagram hotspot -->
  <a class="hotspot hotspot-insta"
     href="https://instagram.com/spendingmoreonmysafety/"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Instagram: @spendingmoreonmysafety"></a>

</div>

<script>
  // June 5 2026, midnight local time (month index 5 = June)
  const EVENT = new Date(2026, 5, 5, 0, 0, 0);

  function pad(n)        { return String(n).padStart(2, '0'); }
  function unit(n, lbl)  { return `<div class="cd-unit"><span class="cd-num">${n}</span><span class="cd-label">${lbl}</span></div>`; }

  function tick() {
    const diff = EVENT - Date.now();
    const el   = document.getElementById('countdown');

    if (diff <= 0) {
      el.innerHTML = '<span class="live-now">LIVE NOW</span>';
      return;
    }

    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff % 86400000 / 3600000);
    const m = Math.floor(diff % 3600000  / 60000);
    const s = Math.floor(diff % 60000    / 1000);

    el.innerHTML =
      unit(pad(d), '') +
      unit(pad(h), '')  +
      unit(pad(m), '')  +
      unit(pad(s), '');
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
